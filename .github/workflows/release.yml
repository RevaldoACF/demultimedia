name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: demultimedia-linux-x86_64.tar.gz
            binary: demultimedia
            raw_name: demultimedia-linux-x86_64
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: demultimedia-windows-x86_64.zip
            binary: demultimedia.exe
            raw_name: demultimedia-windows-x86_64.exe
          - os: macos-latest
            target: aarch64-apple-darwin
            archive: demultimedia-macos-aarch64.tar.gz
            binary: demultimedia
            raw_name: demultimedia-macos-aarch64
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: demultimedia-macos-x86_64.tar.gz
            binary: demultimedia
            raw_name: demultimedia-macos-x86_64

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux GUI dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libxkbcommon-dev

      - name: Build release binary
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Build Linux deb and rpm packages
        if: runner.os == 'Linux'
        run: |
          cargo install cargo-deb cargo-generate-rpm --locked
          mkdir -p dist
          cargo deb --no-build --target ${{ matrix.target }} -o dist/demultimedia-linux-x86_64.deb
          cargo generate-rpm --target ${{ matrix.target }} -o dist/demultimedia-linux-x86_64.rpm

      - name: Package Unix assets
        if: runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p dist staging
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.raw_name }}"
          cp "target/${{ matrix.target }}/release/${{ matrix.binary }}" staging/
          if [ "${{ runner.os }}" = "Linux" ]; then
            cp demultimedia.desktop staging/
          fi
          tar -czf "dist/${{ matrix.archive }}" -C staging .

      - name: Package Windows assets
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist, staging | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" "dist/${{ matrix.raw_name }}"
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary }}" staging/
          Compress-Archive -Path staging/* -DestinationPath "dist/${{ matrix.archive }}"

      - name: Upload release assets
        uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v0.1.0' }}
          generate_release_notes: true
          files: artifacts/*
